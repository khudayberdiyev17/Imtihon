services:
  mongodb:
    image: mongo:6
    container_name: exam-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: exam-system
    volumes:
      - mongodb_data:/data/db
    networks:
      - exam-network
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      options: {max-size: "5m", max-file: "2"}

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: exam-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=128
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://imtihon.cybertron.uz}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      - PORT=3000
      - MONGODB_URI=mongodb://admin:${MONGO_PASSWORD:?Set MONGO_PASSWORD}@mongodb:27017/exam-system?authSource=admin
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - exam-network
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 192m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  admin-panel:
    image: nginx:alpine
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
    logging:
      options: {max-size: "5m", max-file: "2"}
    mem_limit: 32m
    container_name: exam-admin-panel
    restart: unless-stopped
    volumes:
      - ./admin-panel:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - exam-network
    ports:
      - "127.0.0.1:${HTTP_PORT:-8082}:80"

networks:
  exam-network:
    driver: bridge

volumes:
  mongodb_data:
