# Host nginx, AFTER a TLS certificate has been issued for this domain.
server {
    listen 80;
    server_name imtihon.cybertron.uz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name imtihon.cybertron.uz;
    ssl_certificate /etc/letsencrypt/live/imtihon.cybertron.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imtihon.cybertron.uz/privkey.pem;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
